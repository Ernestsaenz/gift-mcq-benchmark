[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag-eval"
version = "0.2.0"
description = "Reproducible benchmark harness and evidence package for a 315-item Spanish gastroenterology/hepatology MCQ evaluation of retrieval-augmented LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["llm", "benchmark", "rag", "medical", "evaluation", "reproducibility"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pydantic>=2",
  "python-dotenv>=1",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
# Test suite. This is all the offline verification path needs.
dev = ["pytest>=8"]
# Regenerating the FULL committed statistics (GEE, bootstrap CIs, latency tables).
# NOT needed for `make verify` — rescore_with_fixed_parser.py is standard-library only.
analysis = ["numpy", "pandas", "scipy", "statsmodels", "tabulate"]
reports = ["Pillow>=10", "python-docx>=1.1"]

[project.scripts]
medrag-eval = "medrag_eval.cli:app"

# The harness lives under `code/`, not `src/`. That path is load-bearing: the
# evidence documents cite provenance as `code/medrag_eval/<file>:<line>`, so
# relocating the package would invalidate every citation in EVIDENCE.md and
# CORRECTION_NOTE.md. Build and test config is retargeted instead of moving code.
[tool.setuptools.packages.find]
where = ["code"]
include = ["medrag_eval*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-q"
